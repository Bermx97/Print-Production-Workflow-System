<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>V2.1 Workflow System</title>

  <style>
    body {
      font-family: Arial;
      background: #000;
      color: #fff;
      margin: 0;
      padding: 20px;
    }

    .box {
      background: #141414;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: none;
      background: #222;
      color: #fff;
    }

    button {
      background: #ff2a2a;
      border: none;
      padding: 10px 14px;
      color: white;
      cursor: pointer;
      border-radius: 8px;
      margin-top: 10px;
      margin-right: 5px;
    }

    .order {
      background: #141414;
      border-left: 4px solid #ff2a2a;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
    }

    pre {
      background: #111;
      padding: 10px;
      border-radius: 8px;
      overflow: auto;
      font-size: 12px;
    }

    .active {
      color: #00ff99;
    }

    .done {
      color: #999;
    }
  </style>
</head>

<body>

<h1>V2.1 WORKFLOW SYSTEM</h1>

<!-- LOGIN -->
<div class="box" id="loginBox">

  <h3>Login</h3>

  <input id="email" placeholder="email" />
  <input id="password" type="password" placeholder="password" />

  <button onclick="login()">LOGIN</button>

  <p id="loginStatus"></p>

</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none">

  <button onclick="loadOrders()">REFRESH</button>
  <button onclick="logout()">LOGOUT</button>

  <div id="container"></div>

</div>

<script>

console.log("NEW V2.1 HTML");
console.log("ONLY THIS FILE EXISTS");
const API = "http://localhost:3000";

let token = localStorage.getItem("token");

if (token) {
  showDashboard();
}

// ---------------- LOGIN ----------------

async function login() {

  const login = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch(`${API}/auth/login`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      login,
      password
    })
  });

  const data = await res.json();

  if (!data.token) {

    document.getElementById(
      "loginStatus"
    ).innerText = "Login failed";

    return;
  }

  localStorage.setItem(
    "token",
    data.token
  );

  token = data.token;

  showDashboard();
}

// ---------------- UI ----------------

function showDashboard() {

  document.getElementById(
    "loginBox"
  ).style.display = "none";

  document.getElementById(
    "dashboard"
  ).style.display = "block";

  loadOrders();
}

function logout() {

  localStorage.removeItem("token");

  location.reload();
}

// ---------------- LOAD ORDERS ----------------

async function loadOrders() {

  const res = await fetch(
    `${API}/orders-v2/my`,
    {
      headers: {
        Authorization: `Bearer ${token}`
      }
    }
  );

  const orders = await res.json();

  console.log("ORDERS:", orders);

  if (!Array.isArray(orders)) {

    console.log(
      "NOT AUTH OR ERROR:",
      orders
    );

    return;
  }

  const container =
    document.getElementById("container");

  container.innerHTML = "";

  for (const order of orders) {

    const state = order.state ?? {};

    const activeStep =
      order.activeStep ?? "DONE";

    const div =
      document.createElement("div");

    div.className = "order";

    div.innerHTML = `
      <h3>
        Order #${order.order_number}
      </h3>

      <p>
        <b>Product:</b>
        ${order.product_type}
      </p>

      <p>
        <b>Current:</b>
        <span class="${
          activeStep === "DONE"
            ? "done"
            : "active"
        }">
          ${activeStep}
        </span>
      </p>

      <pre>
${JSON.stringify(state, null, 2)}
      </pre>

      <button
        onclick="startStep(${order.order_number})"
      >
        START
      </button>

      <button
        onclick="endStep(${order.order_number})"
      >
        END
      </button>
    `;

    container.appendChild(div);
  }
}

// ---------------- START ----------------

async function startStep(orderNumber) {

  const res = await fetch(
    `${API}/orders-v2/${orderNumber}/start`,
    {
      method: "POST",
      headers: {
        Authorization: `Bearer ${token}`
      }
    }
  );

  const data = await res.json();

  console.log("START:", data);

  loadOrders();
}

// ---------------- END ----------------

async function endStep(orderNumber) {

  const res = await fetch(
    `${API}/orders-v2/${orderNumber}/end`,
    {
      method: "POST",
      headers: {
        Authorization: `Bearer ${token}`
      }
    }
  );

  const data = await res.json();

  console.log("END:", data);

  loadOrders();
}

</script>

</body>
</html>
