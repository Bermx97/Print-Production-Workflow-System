<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Orders Debug Dashboard V2.1</title>

  <style>
    body {
      font-family: Arial;
      background: #000;
      color: #fff;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #ff2a2a;
    }

    .order {
      background: #141414;
      border-left: 4px solid #ff2a2a;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
    }

    .title {
      font-size: 20px;
      color: #ff2a2a;
      margin-bottom: 8px;
    }

    .state {
      color: #ccc;
      margin-bottom: 10px;
    }

    button {
      background: #ff2a2a;
      border: none;
      padding: 8px 12px;
      color: white;
      cursor: pointer;
      border-radius: 8px;
      margin-right: 8px;
      margin-top: 8px;
    }

    .secondary {
      background: #222;
    }

    pre {
      background: #111;
      padding: 10px;
      border-radius: 8px;
      overflow: auto;
      font-size: 12px;
    }

    .active {
      color: #00ff99;
    }

    .done {
      color: #999;
    }
  </style>
</head>

<body>

<h1>DEBUG ORDERS DASHBOARD (V2.1)</h1>

<button onclick="loadOrders()">
  REFRESH
</button>

<div id="container"></div>

<script>

console.log("DEBUG DASHBOARD V2.1");

const API = "http://localhost:3000";

const token = localStorage.getItem("token");

if (!token) {
  console.log("NO TOKEN");
}

// ---------------- LOAD ORDERS ----------------

async function loadOrders() {

  const res = await fetch(
    `${API}/orders-v2/my`,
    {
      headers: {
        Authorization: `Bearer ${token}`
      }
    }
  );

  const orders = await res.json();

  console.log("ORDERS:", orders);

  const container =
    document.getElementById("container");

  container.innerHTML = "";

  if (!Array.isArray(orders)) {

    container.innerHTML = `
      <pre>
${JSON.stringify(orders, null, 2)}
      </pre>
    `;

    return;
  }

  for (const order of orders) {

    const state = order.state ?? {};

    let logs = [];

    // ---------------- LOGS ----------------

    try {

      const logsRes = await fetch(
        `${API}/orders/${order.order_number}/logs`,
        {
          headers: {
            Authorization: `Bearer ${token}`
          }
        }
      );

      if (logsRes.ok) {
        logs = await logsRes.json();
      }

    } catch (e) {

      console.log(
        "logs endpoint not ready"
      );
    }

    // ---------------- ACTIVE STEP ----------------

    const activeStep =
      Object.keys(state)
        .find(
          step =>
            state[step] === "ACTIVE"
        ) ?? "DONE";

    // ---------------- CARD ----------------

    const div =
      document.createElement("div");

    div.className = "order";

    div.innerHTML = `
      <div class="title">
        Order #${order.order_number}
      </div>

      <div class="state">

        <b>Product:</b>
        ${order.product_type}

        <br><br>

        <b>Current:</b>

        <span class="${
          activeStep === "DONE"
            ? "done"
            : "active"
        }">
          ${activeStep}
        </span>

        <br><br>

        <b>Workflow State:</b>

        <pre>
${JSON.stringify(state, null, 2)}
        </pre>

      </div>

      <div>

        <button
          onclick="startStep(${order.order_number})"
        >
          START
        </button>

        <button
          class="secondary"
          onclick="endStep(${order.order_number})"
        >
          END
        </button>

      </div>

      <h4>LOGS</h4>

      <pre>
${JSON.stringify(logs, null, 2)}
      </pre>
    `;

    container.appendChild(div);
  }
}

// ---------------- START ----------------

async function startStep(orderNumber) {

  const res = await fetch(
    `${API}/orders-v2/${orderNumber}/start`,
    {
      method: "POST",
      headers: {
        Authorization: `Bearer ${token}`
      }
    }
  );

  const data = await res.json();

  console.log("START:", data);

  loadOrders();
}

// ---------------- END ----------------

async function endStep(orderNumber) {

  const res = await fetch(
    `${API}/orders-v2/${orderNumber}/end`,
    {
      method: "POST",
      headers: {
        Authorization: `Bearer ${token}`
      }
    }
  );

  const data = await res.json();

  console.log("END:", data);

  loadOrders();
}

// ---------------- INIT ----------------

loadOrders();

</script>

</body>
</html>
