<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>My Orders</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:#000000;
      color: #fff;
      font-size: 18px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 30px;
    }

    h1 {
      color: #ff2a2a;
      margin-bottom: 20px;
      letter-spacing: 1px;
      font-size: 34px;
    }

    .top-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    button {
      background: #ff2a2a;
      border: none;
      padding: 10px 14px;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
      font-size: 16px;
    }

    button:hover {
      background: #c90000;
    }

    .secondary {
      background: #1f1f1f;
      border: 1px solid #333;
    }

    .secondary:hover {
      border-color: #ff2a2a;
    }

    #orders {
      margin-top: 20px;
    }

    .order-card {
      background: #141414;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      border-left: 4px solid #ff2a2a;
      box-shadow: 0 0 10px rgba(255, 42, 42, 0.1);
      cursor: pointer;
      transition: 0.2s ease;
      font-size: 18px;
    }

    .order-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 18px rgba(255, 42, 42, 0.25);
      border-left-color: #ff4d4d;
      background: #1a1a1a;
    }

    .order-title {
      color: #ff2a2a;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 20px;
    }

    .steps {
      color: #ccc;
      margin-bottom: 10px;
      font-size: 16px;
    }

    #quantityModal {
      display: none;
    }

    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
    }

    .modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #141414;
      padding: 20px;
      border-radius: 12px;
      border-left: 4px solid #ff2a2a;
      width: 320px;
    }

    .modal h2 {
      margin-top: 0;
      color: #ff2a2a;
    }

    .modal p {
      color: #ccc;
      font-size: 14px;
    }

    .modal input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      background: #1f1f1f;
      border: 1px solid #333;
      color: white;
      border-radius: 8px;
      font-size: 16px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>MY ORDERS</h1>

  <div class="top-bar">

    <button onclick="window.location.href='/create-order.html'">
      Create Order
    </button>

    <button class="secondary" onclick="window.location.href='/all-orders.html'">
      All Orders
    </button>

    <button class="secondary" onclick="loadOrders()">
      Refresh
    </button>

    <input
      id="searchOrderInput"
      type="number"
      placeholder="Order number"
      style="
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid #333;
        background: #1f1f1f;
        color: white;
        font-size: 16px;
        width: 160px;
      "
    />

    <button class="secondary" onclick="searchOrder()">
      Search
    </button>
    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
    <button class="secondary" onclick="logout()">
      Logout
    </button>

  </div>

  <div id="orders"></div>

</div>

<div id="quantityModal">
  <div class="modal-backdrop"></div>

  <div class="modal">
    <h2>End step</h2>
    <p>Enter completed quantity</p>

    <input id="quantityInput" type="number" min="0" />

    <div class="modal-actions">
      <button onclick="confirmEndStep()">Confirm</button>
      <button class="secondary" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<div id="errorBox" style="
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #ff2a2a;
  color: white;
  padding: 12px 16px;
  border-radius: 10px;
  display: none;
  font-weight: bold;
  z-index: 9999;
  max-width: 300px;
"></div>

<script>
  const token = localStorage.getItem("token");
  const API = "/orders";

  const AUTH_HEADER = {
    Authorization: `Bearer ${token}`,
    "Content-Type": "application/json"
  };

  if (!token) {
    window.location.href = "/login.html";
  }

  let currentOrderNumber = null;

  function showError(message) {
    const box = document.getElementById("errorBox");
    box.innerText = message;
    box.style.display = "block";

    setTimeout(() => {
      box.style.display = "none";
    }, 4000);
  }

  function openModal(orderNumber) {
    currentOrderNumber = orderNumber;
    document.getElementById("quantityModal").style.display = "block";
  }

  function closeModal() {
    document.getElementById("quantityModal").style.display = "none";
    document.getElementById("quantityInput").value = "";
    currentOrderNumber = null;
  }

  async function startStep(orderNumber) {
    try {
      const res = await fetch(`${API}/${orderNumber}/start`, {
        method: "POST",
        headers: AUTH_HEADER
      });

      const data = await res.json().catch(() => null);

      if (!res.ok) {
        showError(data?.message || "Error");
        return;
      }

      loadOrders();
    } catch {
      showError("Network error on START");
    }
  }

  async function confirmEndStep() {
    const quantity = document.getElementById("quantityInput").value;

    if (!quantity || quantity <= 0) return;

    try {
      const res = await fetch(`${API}/${currentOrderNumber}/end`, {
        method: "POST",
        headers: AUTH_HEADER,
        body: JSON.stringify({
          stepQuantity: Number(quantity)
        })
      });

      const data = await res.json().catch(() => null);

      if (!res.ok) {
        showError(data?.message || "Error");
        return;
      }

      closeModal();
      loadOrders();

    } catch {
      showError("Network error on END");
    }
  }

  async function searchOrder() {
    const orderNumber = document.getElementById("searchOrderInput").value;

    if (!orderNumber) {
      loadOrders();
      return;
    }

    try {
      const res = await fetch(`${API}/${orderNumber}`, {
        headers: {
          Authorization: `Bearer ${token}`
        }
      });

      const data = await res.json().catch(() => null);

      if (!res.ok) {
        showError(data?.message || "Order not found");
        return;
      }

      const order = data;

      const container = document.getElementById("orders");
      container.innerHTML = "";

      const div = document.createElement("div");
      div.className = "order-card";

      div.onclick = () => {
        window.location.href = `/order.html?orderNumber=${order.order_number}`;
      };

      div.innerHTML = `
        <div class="order-title">
          Order #${order.order_number}
        </div>

        <div class="steps">
          Customer: ${order.customer ?? "none"}<br>
          Product: ${order.product_type ?? "none"}<br>
          Quantity: ${order.quantity ?? "none"}<br>

          ${Object.entries(order.state ?? {}).map(([step, status]) => {
            let icon = "⚪";
            let color = "#94a3b8";

            if (status === "ACTIVE") {
              icon = "🟡";
              color = "#ffcc00";
            }

            if (status === "DONE") {
              icon = "✔";
              color = "#4caf50";
            }

            return `
              <div style="margin-bottom:4px;">
                <span style="color:${color}; font-size:17px;">
                  ${icon} ${step}
                </span>
              </div>
            `;
          }).join("")}
        </div>

        <button onclick="event.stopPropagation(); startStep(${order.order_number})">
          START
        </button>

        <button onclick="event.stopPropagation(); openModal(${order.order_number})">
          END
        </button>
      `;

      container.appendChild(div);

    } catch {
      showError("Network error on SEARCH");
    }
  }

  async function loadOrders() {
    try {
      const res = await fetch(`${API}/my`, {
        headers: {
          Authorization: `Bearer ${token}`
        }
      });

      const data = await res.json().catch(() => null);

      if (!res.ok) {
        showError(data?.message || "Error loading orders");
        return;
      }

      const orders = data;

      const container = document.getElementById("orders");
      container.innerHTML = "";

      orders.forEach(order => {

        const div = document.createElement("div");
        div.className = "order-card";

        div.onclick = () => {
          window.location.href = `/order.html?orderNumber=${order.order_number}`;
        };

        div.innerHTML = `
          <div class="order-title">
            Order #${order.order_number}
          </div>

          <div class="steps">
            Customer: ${order.customer ?? "none"}<br>
            Product: ${order.product_type ?? "none"}<br>
            Quantity: ${order.quantity ?? "none"}<br>

            ${Object.entries(order.state ?? {}).map(([step, status]) => {
              let icon = "⚪";
              let color = "#94a3b8";

              if (status === "ACTIVE") {
                icon = "🟡";
                color = "#ffcc00";
              }

              if (status === "DONE") {
                icon = "✔";
                color = "#4caf50";
              }

              return `
                <div style="margin-bottom:4px;">
                  <span style="color:${color}; font-size:17px;">
                    ${icon} ${step}
                  </span>
                </div>
              `;
            }).join("")}
          </div>

          <button onclick="event.stopPropagation(); startStep(${order.order_number})">
            START
          </button>

          <button onclick="event.stopPropagation(); openModal(${order.order_number})">
            END
          </button>
        `;

        container.appendChild(div);
      });

    } catch {
      showError("Network error on LOAD");
    }
  }

  function logout() {
    localStorage.removeItem("token");
    window.location.href = "/login.html";
  }

  loadOrders();
</script>

</body>
</html>
