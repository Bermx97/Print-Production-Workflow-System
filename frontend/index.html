<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>My Orders</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      font-size: 18px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 30px;
    }

    h1 {
      color: #ff2a2a;
      margin-bottom: 20px;
      letter-spacing: 1px;
      font-size: 34px;
    }

    .top-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }

    .spacer {
      flex: 1;
    }

    button {
      background: #ff2a2a;
      border: none;
      padding: 10px 14px;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
      font-size: 16px;
    }

    button:hover {
      background: #c90000;
    }

    .secondary {
      background: #1f1f1f;
      border: 1px solid #333;
    }

    .secondary:hover {
      border-color: #ff2a2a;
    }

    .search-input {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1f1f1f;
      color: white;
      font-size: 16px;
      width: 180px;
    }

    #orders {
      margin-top: 20px;
    }

    .order-card {
      background: #141414;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 15px;
      border-left: 4px solid #ff2a2a;
      box-shadow: 0 0 10px rgba(255, 42, 42, 0.1);
      cursor: pointer;
      transition: 0.2s ease;
    }

    .order-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 18px rgba(255, 42, 42, 0.25);
      border-left-color: #ff4d4d;
      background: #1a1a1a;
    }

    .order-title {
      color: #ff2a2a;
      font-weight: bold;
      margin-bottom: 12px;
      font-size: 22px;
    }

    .order-info {
      line-height: 1.8;
      color: #ddd;
    }

    .label {
      color: #fff;
      font-weight: bold;
    }

    #errorBox {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #ff2a2a;
      color: white;
      padding: 12px 16px;
      border-radius: 8px;
      display: none;
      font-weight: bold;
      z-index: 9999;
      max-width: 320px;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>MY ORDERS</h1>

  <div class="top-bar">
    <button onclick="window.location.href='/create-order.html'">
      Create Order
    </button>

    <button class="secondary" onclick="window.location.href='/all-orders.html'">
      All Orders
    </button>

    <button class="secondary" onclick="loadOrders()">
      Refresh
    </button>

    <input
      id="searchOrderInput"
      class="search-input"
      type="number"
      placeholder="Order number"
    />

    <button class="secondary" onclick="searchOrder()">
      Search
    </button>

    <div class="spacer"></div>

    <button class="secondary" onclick="logout()">
      Logout
    </button>
  </div>

  <div id="orders"></div>
</div>

<div id="errorBox"></div>

<script>
  const token = localStorage.getItem("token");
  const login = localStorage.getItem("login");
  const API = "/orders";

  if (!token) {
    window.location.href = "/login.html";
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function showError(message) {
    const box = document.getElementById("errorBox");

    box.innerText = message;
    box.style.display = "block";

    setTimeout(() => {
      box.style.display = "none";
    }, 4000);
  }

  function renderOrders(orders) {
    const container = document.getElementById("orders");
    container.innerHTML = "";

    if (!orders.length) {
      container.innerHTML = "<p>No orders found</p>";
      return;
    }

    orders.forEach(order => {
      const div = document.createElement("div");

      div.className = "order-card";

      div.onclick = () => {
        window.location.href =
          `/order-panel.html?orderNumber=${order.order_number}`;
      };

      div.innerHTML = `
        <div class="order-title">
          Order #${escapeHtml(order.order_number)}
        </div>

        <div class="order-info">
          <div>
            <span class="label">Customer:</span>
            ${escapeHtml(order.customer)}
          </div>

          <div>
            <span class="label">Product type:</span>
            ${escapeHtml(order.product_type)}
          </div>

          <div>
            <span class="label">Quantity:</span>
            ${escapeHtml(order.quantity)}
          </div>

          <div>
            <span class="label">Pages:</span>
            ${escapeHtml(order.number_of_pages)}
          </div>
        </div>
      `;

      container.appendChild(div);
    });
  }

  async function searchOrder() {
    const orderNumber =
      document.getElementById("searchOrderInput").value;

    if (!orderNumber) {
      loadOrders();
      return;
    }

    try {
      const res = await fetch(`${API}/${orderNumber}`, {
        headers: {
          Authorization: `Bearer ${token}`
        }
      });

      const data = await res.json();

      if (!res.ok) {
        showError(data.message || "Order not found");
        return;
      }

      renderOrders([data]);

    } catch {
      showError("Search error");
    }
  }

  async function loadOrders() {
    try {
      const res = await fetch(`${API}/my`, {
        headers: {
          Authorization: `Bearer ${token}`
        }
      });

      const data = await res.json();

      if (!res.ok) {
        showError(data.message || "Error loading orders");
        return;
      }

      renderOrders(data);

    } catch {
      showError("Load error");
    }
  }

  function logout() {
    localStorage.removeItem("token");
    window.location.href = "/login.html";
  }

  loadOrders();
</script>

</body>
</html>
