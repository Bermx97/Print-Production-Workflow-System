<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>My Orders</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      font-size: 18px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 30px;
    }

    h1 {
      color: #ff2a2a;
      margin-bottom: 20px;
      letter-spacing: 1px;
      font-size: 34px;
    }

    .top-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }

    .spacer {
      flex: 1;
    }

    button {
      background: #ff2a2a;
      border: none;
      padding: 10px 14px;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
      font-size: 16px;
    }

    button:hover {
      background: #c90000;
    }

    button:disabled, input:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .secondary {
      background: #1f1f1f;
      border: 1px solid #333;
    }

    .secondary:hover {
      border-color: #ff2a2a;
    }

    .search-input {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1f1f1f;
      color: white;
      font-size: 16px;
      width: 180px;
    }

    #orders {
      margin-top: 20px;
    }

    .order-card {
      background: #141414;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 15px;
      border-left: 4px solid #ff2a2a;
      box-shadow: 0 0 10px rgba(255, 42, 42, 0.1);
      cursor: pointer;
      transition: 0.2s ease;
    }

    .order-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 18px rgba(255, 42, 42, 0.25);
      border-left-color: #ff4d4d;
      background: #1a1a1a;
    }

    .order-title {
      color: #ff2a2a;
      font-weight: bold;
      margin-bottom: 12px;
      font-size: 22px;
    }

    .order-info {
      line-height: 1.8;
      color: #ddd;
    }

    .label {
      color: #fff;
      font-weight: bold;
    }

    #errorBox {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #ff2a2a;
      color: white;
      padding: 12px 16px;
      border-radius: 8px;
      display: none;
      font-weight: bold;
      z-index: 9999;
      max-width: 320px;
    }

    .active-banner {
      background: #1c150c;
      border-left: 4px solid #ff9f00;
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 25px;
      box-shadow: 0 0 15px rgba(255, 159, 0, 0.1);
    }
    .active-banner h4 {
      margin: 0 0 6px 0;
      color: #ff9f00;
      font-size: 20px;
    }
    .active-banner p {
      margin: 0 0 10px 0;
      color: #ccc;
      font-size: 15px;
    }
    .active-banner ul {
      margin: 0;
      padding-left: 20px;
      color: #fff;
      font-size: 15px;
    }
    .active-banner li {
      margin-bottom: 4px;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>MY ORDERS</h1>

  <div id="activeTasksBanner" class="active-banner" style="display: none;"></div>

  <div class="top-bar">
    <button onclick="window.location.href='/create-order.html'">
      Create Order
    </button>

    <button class="secondary" onclick="window.location.href='/all-orders.html'">
      All Orders
    </button>

    <button class="secondary" onclick="loadOrders()">
      Refresh
    </button>

    <input
      id="searchOrderInput"
      class="search-input"
      type="number"
      placeholder="Order number"
    />

    <button class="secondary" onclick="searchOrder()">
      Search
    </button>

    <div class="spacer"></div>

    <button class="secondary" onclick="logout()">
      Logout
    </button>
  </div>

  <div id="orders"></div>
</div>

<div id="errorBox"></div>

<script>
  const token = localStorage.getItem("token");
  const login = localStorage.getItem("login");
  const API = "/orders";

  if (!token) {
    window.location.href = "/login.html";
  }

  decodeTokenPayload();

  function decodeTokenPayload() {
    try {
      const payload = token.split(".")[1];
      const base64 = payload.replace(/-/g, "+").replace(/_/g, "/");
      const padded = base64.padEnd(Math.ceil(base64.length / 4) * 4, "=");
      const decoded = JSON.parse(atob(padded));

      if (decoded.exp && decoded.exp * 1000 < Date.now()) {
        logout();
        return {};
      }
      return decoded;
    } catch {
      logout();
      return {};
    }
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function showError(message) {
    const box = document.getElementById("errorBox");

    box.innerText = message;
    box.style.display = "block";

    setTimeout(() => {
      box.style.display = "none";
    }, 4000);
  }

  function setSubmitting(isLoading) {
    document.querySelectorAll(".top-bar button, .top-bar input").forEach(el => {
      el.disabled = isLoading;
    });
  }

  function renderOrders(orders) {
    const container = document.getElementById("orders");
    container.innerHTML = "";

    if (!orders || !orders.length) {
      container.innerHTML = "<p>No orders found</p>";
      return;
    }

    orders.forEach(order => {
      const div = document.createElement("div");
      div.className = "order-card";

      div.onclick = () => {
        window.location.href =
          `/order-panel.html?orderNumber=${order.order_number}`;
      };

      div.innerHTML = `
        <div class="order-title">
          Order #${escapeHtml(order.order_number)}
        </div>

        <div class="order-info">
          <div>
            <span class="label">Customer:</span>
            ${escapeHtml(order.customer)}
          </div>

          <div>
            <span class="label">Product type:</span>
            ${escapeHtml(order.product_type)}
          </div>

          <div>
            <span class="label">Quantity:</span>
            ${escapeHtml(order.quantity)}
          </div>

          <div>
            <span class="label">Pages:</span>
            ${escapeHtml(order.number_of_pages)}
          </div>
        </div>
      `;

      container.appendChild(div);
    });
  }

  async function searchOrder() {
    const orderNumber = document.getElementById("searchOrderInput").value;

    if (!orderNumber) {
      await loadOrders();
      return;
    }

    setSubmitting(true);
    try {
      const res = await fetch(`${API}/${orderNumber}`, {
        headers: {
          Authorization: `Bearer ${token}`
        }
      });

      const data = await res.json().catch(() => null);

      if (!res.ok) {
        showError(data?.message || "Order not found");
        return;
      }

      renderOrders([data]);

    } catch {
      showError("Search error");
    } finally {
      setSubmitting(false);
    }
  }

  async function loadOrders(isBackground = false) {
    if (!isBackground) {
      setSubmitting(true);
    }
    try {
      const res = await fetch(`${API}/my`, {
        headers: {
          Authorization: `Bearer ${token}`
        }
      });

      const data = await res.json().catch(() => null);

      if (!res.ok) {
        if (!isBackground) {
          showError(data?.message || "Error loading orders");
        }
        return;
      }

      renderOrders(data);

    } catch {
      if (!isBackground) {
        showError("Load error");
      }
    } finally {
      if (!isBackground) {
        setSubmitting(false);
      }
    }
  }

  async function checkActiveOperatorSteps() {
    if (!token) return;
    const banner = document.getElementById("activeTasksBanner");

    try {
      const res = await fetch(`${API}/my/active`, {
        headers: {
          Authorization: `Bearer ${token}`
        }
      });

      if (!res.ok) return;

      const activeSteps = await res.json().catch(() => []);

      if (!activeSteps || activeSteps.length === 0) {
        banner.style.display = "none";
        return;
      }

      banner.style.display = "block";
      
      let htmlContent = `
        <h4>⚠️ You have active processes in the background!</h4>
        <p>Remember to stop or pause your work before breaks or leaving for the day:</p>
        <ul>
      `;

      const grouped = {};

      activeSteps.forEach(step => {
        const orderNum = step.order ? step.order.order_number : step.order_id;
        const stepType = step.step_type;
        const key = `${orderNum}_${stepType}`;

        let partName = "";
        if (step.order_part && step.order_part.variant) {
          partName = String(step.order_part.variant).toUpperCase() === "COVER"
            ? "Cover"
            : String(step.order_part.variant).replace(/^V/i, "");
        }

        if (!grouped[key]) {
          grouped[key] = {
            orderNum: orderNum,
            parts: []
          };
        }

        if (partName) {
          grouped[key].parts.push(partName);
        }
      });

    Object.values(grouped).forEach(group => {
      const partsStr = group.parts.length > 0 ? ` —   part: ${group.parts.join(", ")}` : "";

      htmlContent += `
        <li onclick="window.location.href='/order-panel.html?orderNumber=${group.orderNum}'" style="cursor: pointer;">
          <strong>Order #${escapeHtml(group.orderNum)}</strong>${escapeHtml(partsStr)}
        </li>
      `;
    });

      htmlContent += '</ul>';
      banner.innerHTML = htmlContent;

    } catch (err) {
      console.error("Error checking active tasks:", err);
    }
  }

  function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("login");
    window.location.href = "/login.html";
  }

  document.getElementById("searchOrderInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      searchOrder();
    }
  });

  loadOrders();
  checkActiveOperatorSteps();

  setInterval(() => {
    const searchInputValue = document.getElementById("searchOrderInput").value;
    if (!searchInputValue) {
      loadOrders(true);
    }
    checkActiveOperatorSteps(); 
  }, 15000);
</script>

</body>
</html>
