<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Order</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #fff;
      font-size: 18px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 40px;
    }

    h1 {
      color: #ff2a2a;
      margin-bottom: 10px;
      letter-spacing: 1px;
      font-size: 34px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      background: #141414;
      padding: 25px;
      border-radius: 12px;
      border-left: 4px solid #ff2a2a;
      box-shadow: 0 0 15px rgba(255, 42, 42, 0.1);
    }

    label {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 6px;
      display: block;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #2a2a2a;
      background: #1f1f1f;
      color: white;
      outline: none;
      margin-bottom: 15px;
      font-size: 16px;
      box-sizing: border-box;
    }

    input:focus, select:focus {
      border-color: #ff2a2a;
    }

    .full {
      grid-column: span 2;
    }

    button {
      background: #ff2a2a;
      border: none;
      padding: 12px;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
      width: 100%;
      font-size: 16px;
    }

    button:hover {
      background: #c90000;
    }

    #status {
      margin-top: 15px;
      color: #ccc;
      text-align: center;
    }

    .part-row {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr auto;
      gap: 10px;
      margin-bottom: 15px;
      background: #1a1a1a;
      padding: 15px;
      border-radius: 10px;
      align-items: end;
    }

    .remove-btn {
      background: #333;
      height: 44px;
    }

    .remove-btn:hover {
      background: #555;
    }

    #addCoverBtn,
    #addPartBtn {
      margin-top: 10px;
      background: #222;
    }

    #addCoverBtn:hover,
    #addPartBtn:hover {
      background: #333;
    }

    .cover-row {
      grid-template-columns: 1fr auto;
    }

    #logoutBtn {
      width: auto;
      padding: 6px 12px;
      display: block;
      margin: auto;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Create Order</h1>
  <div class="subtitle">Add a new production order to the system</div>

  <form id="orderForm" class="grid">

    <div>
      <label>Order number</label>
      <input type="number" id="orderNumber" required />
    </div>

    <div>
      <label>Due date</label>
      <input type="date" id="dueDate" required />
    </div>

    <div class="full">
      <label>Product type</label>
      <select id="productType" required>
        <option value="">Select product</option>
        <option value="hardcover_book">Hardcover book</option>
        <option value="perfect_bound_book">Perfect bound book</option>
        <option value="saddle_stitching">Saddle stitching</option>
      </select>
    </div>

    <div>
      <label>Customer</label>
      <input type="text" id="customer" />
    </div>

    <div>
      <label>Quantity</label>
      <input type="number" id="quantity" />
    </div>

    <div class="full">
      <label>Number of pages</label>
      <input type="number" id="numberOfPages" />
    </div>

    <div class="full">
      <label>Order parts</label>

      <div id="partsContainer"></div>

      <button type="button" id="addCoverBtn">
        + Add cover
      </button>

      <button type="button" id="addPartBtn">
        + Add variant
      </button>
    </div>

    <div class="full">
      <button type="submit">Create Order</button>
    </div>

  </form>

  <p id="status"></p>

</div>

<script>
  const form = document.getElementById("orderForm");
  const status = document.getElementById("status");

  const partsContainer = document.getElementById("partsContainer");
  const addCoverBtn = document.getElementById("addCoverBtn");
  const addPartBtn = document.getElementById("addPartBtn");

  function updateCoverButtonVisibility() {
    addCoverBtn.style.display = document.querySelector(".cover-row") ? "none" : "";
  }

  function getVariantSelects() {
    return Array.from(document.querySelectorAll(".part-row:not(.cover-row) .variant"));
  }

  function updateVariantOptions() {
    const selectedVariants = new Set(
      getVariantSelects().map(select => select.value)
    );

    getVariantSelects().forEach(select => {
      Array.from(select.options).forEach(option => {
        option.disabled = option.value !== select.value && selectedVariants.has(option.value);
      });
    });
  }

  function createPartRow() {
    const row = document.createElement("div");
    row.className = "part-row";

    row.innerHTML = `
      <div>
        <label>Signatures</label>
        <input type="number" class="runs" min="1" value="1" />
      </div>

      <div>
        <label>Pages</label>
        <select class="variant">
          <option value="V4">4</option>
          <option value="V8">8</option>
          <option value="V16">16</option>
          <option value="V24">24</option>
          <option value="V32">32</option>
          <option value="V64">64</option>
        </select>
      </div>

      <div>
        <label>Quantity</label>
        <input type="number" class="partQuantity" min="1" value="1" />
      </div>

      <button type="button" class="remove-btn">X</button>
    `;

    row.querySelector(".remove-btn").addEventListener("click", () => {
      row.remove();
      updateVariantOptions();
    });

    partsContainer.appendChild(row);
    const selectedVariants = new Set(
      getVariantSelects()
        .filter(select => select !== row.querySelector(".variant"))
        .map(select => select.value)
    );
    const select = row.querySelector(".variant");
    const availableOption = Array.from(select.options).find(option => !selectedVariants.has(option.value));

    if (availableOption) {
      select.value = availableOption.value;
    }

    select.addEventListener("change", updateVariantOptions);
    updateVariantOptions();
  }

  function createCoverRow() {
    const row = document.createElement("div");
    row.className = "part-row cover-row";

    row.innerHTML = `
      <input type="hidden" class="variant" value="COVER" />

      <div>
        <label>Cover quantity</label>
        <input type="number" class="partQuantity" min="1" value="1" />
      </div>

      <button type="button" class="remove-btn">X</button>
    `;

    row.querySelector(".remove-btn").addEventListener("click", () => {
      row.remove();
      updateCoverButtonVisibility();
    });

    partsContainer.appendChild(row);
    updateCoverButtonVisibility();
  }

  const MAX_VARIANTS = 6;
  const MAX_PARTS = 7;

  addCoverBtn.addEventListener("click", () => {
    const count = document.querySelectorAll(".part-row").length;
    const hasCover = Boolean(document.querySelector(".cover-row"));

    if (hasCover) {
      status.innerText = "Cover already added";
      return;
    }

    if (count >= MAX_PARTS) {
      status.innerText = "Maximum 7 parts allowed";
      return;
    }

    createCoverRow();
  });

  addPartBtn.addEventListener("click", () => {
    const count = document.querySelectorAll(".part-row").length;
    const variantCount = document.querySelectorAll(".part-row:not(.cover-row)").length;

    if (variantCount >= MAX_VARIANTS) {
      status.innerText = "Maximum 6 variants allowed";
      return;
    }

    if (count >= MAX_PARTS) {
      status.innerText = "Maximum 7 parts allowed";
      return;
    }

    createPartRow();
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const orderNumber = document.getElementById("orderNumber").value;
    const dueDate = document.getElementById("dueDate").value;
    const productType = document.getElementById("productType").value;

    const customer = document.getElementById("customer").value;
    const quantity = document.getElementById("quantity").value;
    const numberOfPages = document.getElementById("numberOfPages").value;

    const parts = [];

    document.querySelectorAll(".part-row").forEach(row => {
      const part = {
        variant: row.querySelector(".variant").value,
        part_quantity: Number(row.querySelector(".partQuantity").value)
      };
      const runsInput = row.querySelector(".runs");

      if (runsInput) {
        part.runs = Number(runsInput.value);
      }

      parts.push(part);
    });

    const variants = parts.map(part => part.variant);
    if (new Set(variants).size !== variants.length) {
      status.innerText = "Error: Order parts variants must be unique";
      return;
    }

    try {
      const res = await fetch('/orders', {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${localStorage.getItem("token")}`
        },
        body: JSON.stringify({
          orderNumber,
          dueDate,
          productType,
          customer,
          quantity,
          numberOfPages,
          parts
        })
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.message || "Error");
      }

      status.innerText = "Order created successfully";
      form.reset();
      partsContainer.innerHTML = "";
      updateCoverButtonVisibility();
      createPartRow();

    } catch (err) {
      status.innerText = "Error: " + err.message;
    }
  });

</script>
<button id="logoutBtn">Logout</button>
<script>
    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("token");
      window.location.href = "/login.html";
    });
</script>
</body>
</html>
