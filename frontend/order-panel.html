<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Order Panel</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px 20px 20px 20px;
    }

    .container {
      max-width: 1300px;
      width: 100%;
      padding: 45px;
    }

    h1 {
      color: #ff2a2a;
      margin-bottom: 20px;
      letter-spacing: 1px;
      font-size: 38px;
    }

    .top-bar {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
      flex-wrap: wrap;
      align-items: center;
    }

    .spacer {
      flex: 1;
    }

    button {
      background: #ff2a2a;
      border: none;
      padding: 14px 22px;
      color: white;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
      font-size: 17px;
    }

    button:hover {
      background: #c90000;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.75;
    }

    .secondary {
      background: #1f1f1f;
      border: 1px solid #333;
    }

    .secondary:hover {
      border-color: #ff2a2a;
    }

    .warning {
      background: #f59e0b;
      color: #111;
    }

    .warning:hover {
      background: #d97706;
    }

    .back-btn {
      background: #ff2a2a;
    }

    .back-btn:hover {
      background: #c90000;
    }

    .search-input {
      padding: 11px 15px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #1f1f1f;
      color: white;
      font-size: 17px;
      width: 175px;
    }

    #orders {
      margin-top: 15px;
    }

    .order-card {
      background: #141414;
      border-radius: 12px;
      padding: 32px;
      margin-bottom: 22px;
      border-left: 7px solid #ff2a2a;
      box-shadow: 0 0 20px rgba(255, 42, 42, 0.15);
      transition: 0.2s ease;
    }

    .order-title {
      color: #ff2a2a;
      font-weight: bold;
      margin-bottom: 18px;
      font-size: 33px;
    }

    .order-info {
      margin-bottom: 22px;
      line-height: 1.9;
      font-size: 20px;
    }

    .steps {
      color: #ccc;
      margin: 18px 0;
      font-size: 20px;
    }

    .state-row {
      margin-bottom: 6px;
      padding: 4px 0;
    }

    .state-label {
      font-size: 21px;
      font-weight: 500;
    }

    .parts-title {
      margin-top: 22px;
      color: #fff;
      font-weight: bold;
      font-size: 22px;
      margin-bottom: 14px;
    }

    .parts {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 14px;
      margin-bottom: 22px;
    }

    .part-btn {
      background: #1f1f1f;
      border: 2px solid #333;
      color: #fff;
      padding: 15px 18px;
      border-radius: 10px;
      font-size: 17px;
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 7px;
      min-width: 170px;
      min-height: 92px;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .part-btn:hover {
      background: #252525;
      border-color: #ff2a2a;
    }

    .part-btn.selected {
      border-color: #ff2a2a;
      box-shadow: 0 0 0 2px #ff2a2a inset;
    }

    .part-btn.active {
      border-color: #ffcc00;
      color: #ffdf5d;
    }

    .part-btn.done {
      border-color: #4caf50;
      color: #9be49f;
      background: #122015;
    }

    .part-btn.paused {
      border-color: #38bdf8;
      color: #7dd3fc;
      background: #0b1a24;
    }

    .part-btn.blocked {
      border-color: #555;
      color: #888;
      background: #181818;
      cursor: not-allowed;
    }

    .part-status {
      font-size: 15px;
      opacity: 0.9;
    }

    .actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 22px;
    }

    .actions button {
      padding: 16px 28px;
      font-size: 19px;
    }

    #quantityModal {
      display: none;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 999;
    }

    .modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #141414;
      padding: 36px;
      border-radius: 12px;
      border-left: 7px solid #ff2a2a;
      width: 90%;
      max-width: 460px;
      z-index: 1000;
    }

    .modal h2 {
      margin-top: 0;
      color: #ff2a2a;
      font-size: 26px;
    }

    .modal p {
      color: #ccc;
      font-size: 17px;
      margin-bottom: 22px;
    }

    .modal input {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      margin: 18px 0;
      background: #1f1f1f;
      border: 1px solid #333;
      color: white;
      border-radius: 10px;
      font-size: 18px;
    }

    .modal-actions {
      display: flex;
      gap: 14px;
      margin-top: 22px;
    }

    .modal-actions button {
      flex: 1;
      padding: 15px;
      font-size: 17px;
    }

    #errorBox {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #ff2a2a;
      color: white;
      padding: 16px 22px;
      border-radius: 10px;
      display: none;
      font-weight: bold;
      z-index: 9999;
      max-width: 400px;
      font-size: 17px;
    }

    .muted {
      color: #888;
      font-size: 16px;
    }

    .top-left-logo {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 110px;
      height: auto;
      z-index: 1000;
    }
  </style>
</head>

<body>
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTA9bY76TH7jnJ41qwRYSfYenBBUwd0Rvz8fwWvCuTE5A&s=10" class="top-left-logo" alt="Logo">
  <div class="container">
    <h1 id="pageTitle">Current Job</h1>
    <div class="top-bar">
      <button class="back-btn" onclick="window.location.href='/index.html'">Back to Orders</button>
      <button class="secondary" onclick="loadOrder()">Refresh</button>
      <button class="analytics" id="analyticsBtn">Analytics</button>
      <div class="spacer"></div>
      <button class="secondary" onclick="logout()">Logout</button>
    </div>

    <div id="orders"></div>
  </div>

  <div id="quantityModal">
    <div class="modal-backdrop" onclick="closeModal()"></div>

    <div class="modal">
      <h2>End step</h2>
      <p id="endModalText">Enter completed quantity</p>

      <input id="quantityInput" type="number" min="1" />

      <div class="modal-actions">
        <button onclick="confirmEndStep()">Confirm</button>
        <button class="secondary" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <div id="errorBox"></div>

  <script>
    const token = localStorage.getItem("token");
    const API = "/orders";

    if (!token) {
      window.location.href = "/login.html";
    }

    const AUTH_HEADER = {
      Authorization: `Bearer ${token}`,
      "Content-Type": "application/json"
    };

    const STEP_SCOPE = {
      printing: "per_part",
      folding: "per_part",
      folding_with_milling: "per_part",
      sewing: "aggregated",
      case_making: "aggregated",
      hardcover_binding: "per_order",
      binding: "per_order",
      stitching: "per_order"
    };

    const ROLE_REQUIRES_PART = {
      printer_operator: true,
      folding_operator: true,
      sewing_operator: false,
      case_maker: false,
      hardcover_binder_operator: false,
      perfect_bound_operator: false,
      stitching_operator: false,
      seller: false,
      technologist: false,
      admin: false
    };

    const selectedParts = {};
    const partLabels = {};

    let currentOrderNumber = null;
    let currentOrderPartId = null;

    const tokenPayload = decodeTokenPayload();
    const currentRole =
      tokenPayload.role ||
      tokenPayload.employee_role ||
      tokenPayload.employeeRole ||
      null;

    function decodeTokenPayload() {
      try {
        const payload = token.split(".")[1];
        const base64 = payload.replace(/-/g, "+").replace(/_/g, "/");
        const padded = base64.padEnd(Math.ceil(base64.length / 4) * 4, "=");
        const decoded = JSON.parse(atob(padded));

        if (decoded.exp && decoded.exp * 1000 < Date.now()) {
          logout();
          return {};
        }
        return decoded;
      } catch {
        logout();
        return {};
      }
    }

    const params = new URLSearchParams(window.location.search);
    const orderNumber = params.get("orderNumber");

    document.getElementById("analyticsBtn").onclick = () => {
      window.location.href = `/analytics.html?orderNumber=${orderNumber}`;
    };

    function currentStepNeedsPart() {
      if (!currentRole) return true;
      return ROLE_REQUIRES_PART[currentRole] === true;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalizeStatus(value) {
      if (!value) return "";

      const status = String(value).toUpperCase();

      if (status === "END" || status === "FINISHED" || status === "COMPLETED") {
        return "DONE";
      }

      if (status === "START" || status === "IN_PROGRESS") {
        return "ACTIVE";
      }

      if (status === "PAUSE" || status === "PAUSED") {
        return "PAUSED";
      }

      if (status === "RESUME") {
        return "ACTIVE";
      }

      return status;
    }

    function formatVariant(value) {
      if (String(value).toUpperCase() === "COVER") return "Cover";
      return String(value ?? "variant").replace(/^V/i, "");
    }

    function isCoverVariant(value) {
      return String(value ?? "").toUpperCase() === "COVER";
    }

    function getVariantSortValue(value) {
      const variant = String(value ?? "").toUpperCase();

      if (variant === "COVER") return Number.POSITIVE_INFINITY;

      const pages = Number(variant.replace(/^V/i, ""));
      return Number.isFinite(pages) ? pages : -1;
    }

    function sortPartsForSelection(parts) {
      return [...parts].sort((a, b) =>
        getVariantSortValue(b.variant) - getVariantSortValue(a.variant)
      );
    }

    function getPartStatus(part) {
      const state =
        part.state ||
        part.step_state ||
        part.stepState ||
        part.steps;

      if (state && currentRole && state[currentRole]) {
        return normalizeStatus(state[currentRole]);
      }

      const directStatus =
        part.status ||
        part.step_status ||
        part.stepStatus ||
        part.execution_status ||
        part.current_status;

      if (directStatus) {
        return normalizeStatus(directStatus);
      }

      if (part.done === true || part.is_done === true || part.completed === true) {
        return "DONE";
      }

      if (part.active === true || part.is_active === true) {
        return "ACTIVE";
      }

      const executions =
        part.step_executions ||
        part.step_execution ||
        part.executions ||
        [];

      if (Array.isArray(executions) && executions.length > 0) {
        const matchingExecutions = currentRole
          ? executions.filter(execution =>
            execution.step_type === currentRole ||
            execution.step_name === currentRole
          )
          : executions;

        const latest = matchingExecutions
          .slice()
          .sort((a, b) => {
            const aDate = new Date(a.finished_at || a.started_at || a.created_at || 0);
            const bDate = new Date(b.finished_at || b.started_at || b.created_at || 0);
            return bDate - aDate;
          })[0];

        if (latest) {
          return normalizeStatus(latest.status || latest.event_type);
        }
      }

      return "AVAILABLE";
    }

    function showError(message) {
      const box = document.getElementById("errorBox");
      box.innerText = message;
      box.style.display = "block";

      setTimeout(() => {
        box.style.display = "none";
      }, 4000);
    }

    function setSubmitting(isLoading) {
      document.querySelectorAll(".actions button, .top-bar button, .modal-actions button").forEach(btn => {
        btn.disabled = isLoading;
      });
    }

    function selectPart(orderNumber, partId, button) {
      selectedParts[orderNumber] = partId;

      const container = button.closest(".parts");

      container.querySelectorAll(".part-btn").forEach(btn => {
        btn.classList.remove("selected");
      });

      button.classList.add("selected");
    }

    function getSelectedPartId(orderNumber) {
      return selectedParts[orderNumber] || null;
    }

    function ensureSelectedPart(orderNumber) {
      const orderPartId = getSelectedPartId(orderNumber);

      if (currentStepNeedsPart() && !orderPartId) {
        showError("Select variant first");
        return null;
      }

      return orderPartId;
    }

    async function sendStepAction(orderNumber, action, body, errorLabel) {
      setSubmitting(true);
      try {
        const res = await fetch(`${API}/${orderNumber}/${action}`, {
          method: "POST",
          headers: AUTH_HEADER,
          body: JSON.stringify(body)
        });

        const data = await res.json().catch(() => null);

        if (!res.ok) {
          showError(data?.message || `Error on ${errorLabel}`);
          return false;
        }

        await loadOrder();
        return true;
      } catch {
        showError(`Network error on ${errorLabel}`);
        return false;
      } finally {
        setSubmitting(false);
      }
    }

    async function startStep(orderNumber) {
      const orderPartId = ensureSelectedPart(orderNumber);

      if (currentStepNeedsPart() && !orderPartId) {
        return;
      }

      await sendStepAction(orderNumber, "start", { orderPartId }, "START");
    }

    async function pauseStep(orderNumber) {
      const orderPartId = ensureSelectedPart(orderNumber);

      if (currentStepNeedsPart() && !orderPartId) {
        return;
      }

      await sendStepAction(orderNumber, "pause", { orderPartId }, "PAUSE");
    }

    function openModal(orderNumber) {
      const orderPartId = ensureSelectedPart(orderNumber);

      if (currentStepNeedsPart() && !orderPartId) {
        return;
      }

      currentOrderNumber = orderNumber;
      currentOrderPartId = orderPartId;

      const label =
        partLabels[orderNumber]?.[orderPartId] ||
        "whole order";

      document.getElementById("endModalText").innerText =
        `Enter completed quantity for ${label}`;

      document.getElementById("quantityModal").style.display = "block";
    }

    function closeModal() {
      document.getElementById("quantityModal").style.display = "none";
      document.getElementById("quantityInput").value = "";
      currentOrderNumber = null;
      currentOrderPartId = null;
    }

    async function confirmEndStep() {
      const quantity = Number(document.getElementById("quantityInput").value);

      if (!Number.isFinite(quantity) || quantity <= 0) {
        showError("Enter completed quantity");
        return;
      }

      setSubmitting(true);
      try {
        const res = await fetch(`${API}/${currentOrderNumber}/end`, {
          method: "POST",
          headers: AUTH_HEADER,
          body: JSON.stringify({
            orderPartId: currentOrderPartId,
            doneQuantity: quantity
          })
        });

        const data = await res.json().catch(() => null);

        if (!res.ok) {
          showError(data?.message || "Error on END");
          return;
        }

        closeModal();
        await loadOrder();
      } catch {
        showError("Network error on END");
      } finally {
        setSubmitting(false);
      }
    }

    function renderState(state, workflow, stats = {}, parts = []) {
      if (!state || typeof state !== "object") {
        state = {};
      }

      if (!Array.isArray(workflow)) {
        workflow = [];
      }

      return workflow.map(step => {
        const normalized = normalizeStatus(state[step] || "WAITING");

        let icon = "&#9898;";
        let color = "#94a3b8";

        if (normalized === "ACTIVE") {
          icon = "&#128993;";
          color = "#ffcc00";
        }

        if (normalized === "PAUSED") {
          icon = "&#9208;";
          color = "#38bdf8";
        }

        if (normalized === "DONE") {
          icon = "&#10004;";
          color = "#4caf50";
        }

        let statsText = "";
        if (stats[step]) {
          const stepVariants = stats[step];

        const sortedEntries = Object.entries(stepVariants).sort((a, b) => {
          const vA = a[0].toUpperCase();
          const vB = b[0].toUpperCase();

          if (vA === "UNKNOWN") return 1;
          if (vB === "UNKNOWN") return -1;

          if (vA === "COVER") return 1;
          if (vB === "COVER") return -1;

          return vA.localeCompare(vB);
      });
          statsText = sortedEntries
            .map(([variant, qty]) => {
              if (!variant || variant.toUpperCase() === "UNKNOWN") {
                return `<span style="margin-left: 15px; color: #fff; font-weight: bold; font-size: 18px; background: #111; padding: 5px 12px; border-radius: 4px; border-left: 4px solid #ff2a2a; white-space: nowrap;">(${qty})pcs</span>`;
              }

              const variantName = formatVariant(variant);
              const matchingPart = parts.find(p => String(p.variant) === String(variant));
              const runs = matchingPart ? (matchingPart.runs ?? "?") : "?";
              if (isCoverVariant(variant)) {
                return `<span style="margin-left: 15px; color: #fff; font-weight: bold; font-size: 18px; background: #111; padding: 5px 12px; border-radius: 4px; border-left: 4px solid #ff2a2a; white-space: nowrap;">${escapeHtml(variantName)}:  (${qty})pcs</span>`;
              }
              return `<span style="margin-left: 15px; color: #fff; font-weight: bold; font-size: 18px; background: #111; padding: 5px 12px; border-radius: 4px; border-left: 4px solid #ff2a2a; white-space: nowrap;">${escapeHtml(runs)}  X  ${escapeHtml(variantName)}:  (${qty})pcs</span>`;
            })
            .join("");
        }

        return `
        <div class="state-row" style="display: flex; align-items: center; flex-wrap: wrap; margin-bottom: 10px; gap: 5px 0;">
          <span class="state-label" style="color:${color};">
            ${icon} ${escapeHtml(step)}
          </span>
          ${statsText}
        </div>
      `;
      }).join("");
    }

    function renderOrders(orders, stats = {}, parts = []) {
      const container = document.getElementById("orders");
      container.innerHTML = "";

      (orders || []).forEach(order => {
        const div = document.createElement("div");
        div.className = "order-card";

        const partsId = `parts-${order.order_number}`;

        const allStepsDone = Array.isArray(order.workflow) &&
          order.workflow.length > 0 &&
          order.workflow.every(step => normalizeStatus(order.state?.[step]) === "DONE");

        const allPartsDone = Array.isArray(parts) &&
          parts.length > 0 &&
          parts.every(part => getPartStatus(part) === "DONE");

        let currentOperatorDone = false;
        if (currentRole && order.state) {
          const roleToStepMap = {
            printer_operator: ["printing"],
            folding_operator: ["folding", "folding_with_milling"],
            sewing_operator: ["sewing"],
            case_maker: ["case_making"],
            hardcover_binder_operator: ["hardcover_binding"],
            perfect_bound_operator: ["binding"],
            stitching_operator: ["stitching"]
          };
          const stepsToCheck = roleToStepMap[currentRole] || [];
          const relevantSteps = stepsToCheck.filter(step => order.workflow?.includes(step));
          if (relevantSteps.length > 0) {
            currentOperatorDone = relevantSteps.every(step => normalizeStatus(order.state[step]) === "DONE");
          }
        }

        const hideControls = allStepsDone || allPartsDone || currentOperatorDone;
        const showParts = currentStepNeedsPart() && !hideControls;

        div.innerHTML = `
        <div class="order-title">
          Order #${escapeHtml(order.order_number)}
        </div>

        <div class="order-info">
          Customer: ${escapeHtml(order.customer ?? "none")}<br>
          Product: ${escapeHtml(order.product_type ?? "none")}<br>
          Quantity: ${escapeHtml(order.quantity ?? "none")}
        </div>

        <div class="steps">
          ${renderState(order.state, order.workflow, stats, parts)}
        </div>

        ${showParts
            ? `
            <div class="parts-title">Parts</div>
            <div class="parts" id="${partsId}"></div>
          `
            : ""}

        ${!hideControls
            ? `
            <div class="actions">
              <button onclick="startStep(${order.order_number})">
                START
              </button>

              <button class="warning" onclick="pauseStep(${order.order_number})">
                PAUSE
              </button>

              <button class="secondary" onclick="openModal(${order.order_number})">
                END
              </button>
            </div>
          `
            : ""}
      `;

        container.appendChild(div);

        if (showParts) {
          renderPartsSync(order.order_number, partsId, parts);
        }
      });
    }

    function renderPartsSync(orderNumber, containerId, parts) {
      const container = document.getElementById(containerId);
      if (!container) return;

      container.innerHTML = "";
      partLabels[orderNumber] = {};

      if (!parts || parts.length === 0) {
        container.innerHTML = `<span class="muted">No parts</span>`;
        return;
      }

      const sortedParts = sortPartsForSelection(parts);

      const selectedStillExists = sortedParts.some(part =>
        String(part.id) === String(selectedParts[orderNumber])
      );

      if (!selectedStillExists && currentStepNeedsPart()) {
        const firstOpenPart = sortedParts.find(part => {
          const status = getPartStatus(part);
          return status !== "DONE" && status !== "BLOCKED";
        });
        selectedParts[orderNumber] = firstOpenPart?.id || null;
      }

      sortedParts.forEach(part => {
        const status = getPartStatus(part);
        const label = `${formatVariant(part.variant)} (${part.part_quantity ?? "?"})`;
        const runs = part.runs ?? "?";
        const partText = isCoverVariant(part.variant)
          ? `${label}pcs`
          : `${runs} X ${label}pcs`;

        partLabels[orderNumber][part.id] = label;

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "part-btn";

        if (String(selectedParts[orderNumber]) === String(part.id)) {
          btn.classList.add("selected");
        }

        if (status === "ACTIVE") btn.classList.add("active");
        if (status === "PAUSED") btn.classList.add("paused");

        if (status === "DONE") {
          btn.classList.add("done");
          btn.disabled = true;
        }

        if (status === "BLOCKED") {
          btn.classList.add("blocked");
          btn.disabled = true;
        }

        btn.innerHTML = `
          <span>${escapeHtml(partText)}</span>
          <span class="part-status">
            ${status === "DONE" ? "&#10003; done" : escapeHtml(status.toLowerCase())}
          </span>
        `;

        btn.onclick = event => {
          event.stopPropagation();

          if (status === "DONE" || status === "BLOCKED") {
            return;
          }

          selectPart(orderNumber, part.id, btn);
        };

        container.appendChild(btn);
      });
    }

    async function loadOrder() {
      const params = new URLSearchParams(window.location.search);
      const orderNumber = params.get("orderNumber");

      if (!orderNumber) {
        window.location.href = "/index.html";
        return;
      }

      try {
        const [orderRes, statsRes, partsRes] = await Promise.all([
          fetch(`${API}/${orderNumber}`, {
            headers: { Authorization: `Bearer ${token}` }
          }),
          fetch(`${API}/${orderNumber}/stats`, {
            headers: { Authorization: `Bearer ${token}` }
          }),
          fetch(`${API}/${orderNumber}/parts`, {
            headers: { Authorization: `Bearer ${token}` }
          })
        ]);

        const orderData = await orderRes.json().catch(() => null);
        const statsData = await statsRes.json().catch(() => null);
        const partsData = await partsRes.json().catch(() => null);

        if (!orderRes.ok) {
          showError(orderData?.message || "Order not found");
          return;
        }

        const stats = statsData?.doneByStepAndVariant || {};
        const parts = partsData?.order_parts || partsData?.parts || [];

        renderOrders([orderData], stats, parts);
      } catch {
        showError("Network error on LOAD");
      }
    }

    function logout() {
      localStorage.removeItem("token");
      window.location.href = "/login.html";
    }

    loadOrder();

    setInterval(() => {
      if (!currentOrderNumber) {
        loadOrder();
      }
    }, 10000);
  </script>

</body>

</html>
