<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Details</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #fff;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px;
    }

    h1 {
      color: #ff2a2a;
    }

    .card {
      background: #141414;
      padding: 20px;
      border-left: 4px solid #ff2a2a;
      border-radius: 8px;
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 10px;
    }

    .label { color: #ff2a2a; font-weight: bold; }
    .value { color: #fff; }

    .step {
      background: #1a1a1a;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #222;
      
    }

    button {
      background: #ff2a2a;
      border: none;
      padding: 10px 14px;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
      font-size: 14px;
      margin-bottom: 12px;
    }

    button:hover {
      background: #c90000;
    }

  </style>
</head>

<body>
<div class="container">
  <h1>ORDER DETAILS</h1>

  <button class="my_orders" onclick="window.location.href='/index.html'">
    My Orders
  </button>

  <div class="card" id="card">Loading...</div>
</div>

<script>
const token = localStorage.getItem("token");
const params = new URLSearchParams(window.location.search);
const orderNumber = params.get("orderNumber");

if (!token) window.location.href = "/login.html";

function buildStateFromLogs(logs, workflow) {
  const state = {};

  workflow.forEach(step => {
    const hasStart = logs.some(l =>
      l.step_name === step && l.event_type === "START"
    );

    const hasEnd = logs.some(l =>
      l.step_name === step && l.event_type === "END"
    );

    if (hasEnd) state[step] = "DONE";
    else if (hasStart) state[step] = "ACTIVE";
    else state[step] = "NOT_STARTED";
  });

  return state;
}

async function loadOrder() {
  const res = await fetch(`/orders/${orderNumber}`, {
    headers: { Authorization: `Bearer ${token}` }
  });

  const order = await res.json();

  const analyticsRes = await fetch(`/orders/${orderNumber}/analytics`, {
    headers: { Authorization: `Bearer ${token}` }
  });

  const analytics = await analyticsRes.json();

  const logs = order.step_logs || [];
  const workflow = order.workflow || [];
  const quantities = order.step_quantities || {};

  const state = buildStateFromLogs(logs, workflow);

  const card = document.getElementById("card");

  card.innerHTML = `
    <div class="label">Order number:</div>
    <div class="value"># ${order.order_number}</div>

    <div class="label">Customer:</div>
    <div class="value">${order.customer ?? "-"}</div>

    <div class="label">Product:</div>
    <div class="value">${order.product_type}</div>

    <div class="label">Pages:</div>
    <div class="value">${order.number_of_pages ?? "-"}</div>

    <div class="label">Quantity:</div>
    <div class="value">${order.quantity ?? "-"}</div>

    <div class="label">Workflow</div>
    <div class="value">
      ${workflow.map(step => {

        const status = state[step];

        let icon = "⏳";
        let color = "#94a3b8";

        if (status === "ACTIVE") {
          icon = "🟡";
          color = "#ffcc00";
        }

        if (status === "DONE") {
          icon = "✔";
          color = "#4caf50";
        }

        const speedData = analytics.speeds?.find(
          s => s.step === step
        );

        return `
          <div class="step">
            <span style="color:${color}">
              ${icon} ${step}<br>
            </span>

            ${step} quantity: ${quantities[step] ?? "-"}
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            ${step} speed:${speedData?.speed?.toFixed(2) ?? "-"}/h
          </div>
        `;
      }).join("")}
    </div>
  `;
}

loadOrder();
</script>

</body>
</html>
