<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Details</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #fff;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 30px;
    }

    h1 {
      color: #ff2a2a;
      margin-bottom: 20px;
    }

    .card {
      background: #141414;
      border-left: 4px solid #ff2a2a;
      padding: 20px;
      border-radius: 8px;

      display: grid;
      grid-template-columns: 150px 1fr;
      row-gap: 12px;
      column-gap: 15px;
    }

    .label {
      color: #ff2a2a;
      font-weight: bold;
    }

    .value {
      color: #fff;
    }

    button {
      background: #ff2a2a;
      border: none;
      padding: 10px 14px;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 15px;
      margin-right: 10px;
    }

    button:hover {
      background: #c90000;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>ORDER DETAILS</h1>

  <div class="card" id="orderCard">
    Loading...
  </div>

  <button onclick="goBack()">Back</button>
  <button onclick="startStep()">Start Step</button>
  <button onclick="endStep()">End Step</button>

</div>

<script>
  const token = localStorage.getItem("token");

  if (!token) {
    window.location.href = "/login.html";
  }

  const OLD_API = "/orders";
  const V2_API = "/orders-v2";

  const params = new URLSearchParams(window.location.search);
  const orderNumber = params.get("orderNumber");

  const card = document.getElementById("orderCard");

  function safe(val) {
    if (val === 0) return 0;
    if (val === null || val === undefined) return "-";
    return val;
  }

  // =========================
  // LOAD (OLD + V2 MERGE)
  // =========================
  async function loadOrder() {
    try {
      // OLD DATA (business data)
      const resOld = await fetch(`${OLD_API}/${orderNumber}`, {
        headers: {
          Authorization: `Bearer ${token}`
        }
      });

      if (!resOld.ok) throw new Error("Failed to load order");

      const order = await resOld.json();

      // V2 DATA (workflow)
      const resV2 = await fetch(`${V2_API}/${orderNumber}`, {
        headers: {
          Authorization: `Bearer ${token}`
        }
      });

      let v2 = null;
      if (resV2.ok) {
        v2 = await resV2.json();
      }

      const state = v2?.state ?? {};
      const workflow = Object.keys(state);

      const pages = order.number_of_pages ?? "-";
      const quantity = order.quantity ?? "-";

      card.innerHTML = `
        <div class="label">Order</div>
        <div class="value">${order.order_number}</div>

        <div class="label">Product</div>
        <div class="value">${safe(order.product_type)}</div>

        <div class="label">Customer</div>
        <div class="value">${safe(order.customer)}</div>

        <div class="label">Pages</div>
        <div class="value">${pages}</div>

        <div class="label">Quantity</div>
        <div class="value">${quantity}</div>

        <div class="label">Due date</div>
        <div class="value">
          ${order.due_date ? new Date(order.due_date).toLocaleDateString() : "-"}
        </div>

        <div class="label">Workflow</div>
        <div class="value">
          ${
            workflow.length
              ? workflow.map(step => {
                  const value = state?.[step];

                  const icon =
                    value === "done" || value === true
                      ? "✔"
                      : "⏳";

                  return `${icon} ${step} — ${safe(value)}`;
                }).join("<br>")
              : `
                ⏳ printing — -<br>
                ⏳ folding — -<br>
                ⏳ sewing — -<br>
                ⏳ case_making — -<br>
                ⏳ hardcover_binding — -
              `
          }
        </div>
      `;

    } catch (err) {
      console.error(err);
      card.innerHTML = `<div class="value">Error loading order</div>`;
    }
  }

  // =========================
  // V2 START
  // =========================
  async function startStep() {
    await fetch(`${V2_API}/${orderNumber}/start`, {
      method: "POST",
      headers: {
        Authorization: `Bearer ${token}`
      }
    });

    loadOrder();
  }

  // =========================
  // V2 END
  // =========================
  async function endStep() {
    await fetch(`${V2_API}/${orderNumber}/end`, {
      method: "POST",
      headers: {
        Authorization: `Bearer ${token}`
      }
    });

    loadOrder();
  }

  function goBack() {
    window.location.href = "/all-orders.html";
  }

  loadOrder();
</script>

</body>
</html>
